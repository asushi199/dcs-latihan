 { n: '按顺序画图 || Melukis Mengikut Urutan', steps: [{ ask: '绘画机由外向内画正方形，顺序是：蓝 → 黄 → 红 → 绿 → 紫。哪一幅是结果？ || Mesin melukis segi empat sama dari luar ke dalam: biru → kuning → merah → hijau → ungu. Gambar manakah hasilnya?', make: mcq({ pic: true, a: 3, opts: [rings(['紫', '绿', '红', '黄', '蓝'], 1), rings(['蓝', '红', '黄', '绿', '紫'], 2), rings(['黄', '蓝', '红', '绿', '紫'], 3), rings(['蓝', '黄', '红', '绿', '紫'], 4)], why: '对！严格按顺序，才会得到正确结果。 || Betul! Ikut urutan dengan tepat untuk mendapat hasil yang betul.', hint: '从最外面一层开始，逐层对照颜色。 || Mulakan dari lapisan paling luar dan semak warna satu demi satu.' }) }] },
 { n: '编程走路 || Pengekodan Pergerakan', steps: STAGES.map((st, i) => { const [zh, ms] = st.t.split(SEP); return { ask: `任务 ${i + 1}：${zh} || Tugasan ${i + 1}: ${ms}`, make: robot(st) }; }) },
 { n: '读代码找错误 || Baca Kod dan Cari Ralat', steps: [
  { ask: '根据伪代码，机器人最后停在哪一面旗子？ || Berdasarkan pseudokod, di bendera manakah robot berhenti?', make: pseudo },
  { ask: '分数是 80，应该输出 Lulus（及格）。只修改一个比较符号，再按“执行”。 || Markah ialah 80, jadi output sepatutnya Lulus. Tukar satu simbol perbandingan sahaja, kemudian tekan “Laksana”.', make: debug } ] }
];

/* ---------- shell ---------- */
const S = { l: 0, s: 0, done: new Set(), end: false };
const key = (l, s) => l + '-' + s, total = LEVELS.reduce((a, l) => a + l.steps.length, 0);
const levelDone = l => LEVELS[l].steps.every((_, s) => S.done.has(key(l, s)));
const scoreText = () => `已完成 ${S.done.size} / ${total} 题 || Selesai ${S.done.size} / ${total} soalan`;
function go(l, s = 0) { S.l = l; S.s = s; S.end = false; try { history.replaceState(null, '', '#level-' + (l + 1)); } catch (_) {} render(); }
function next() { const L = LEVELS[S.l]; if (S.s + 1 < L.steps.length) go(S.l, S.s + 1); else if (S.l + 1 < LEVELS.length) go(S.l + 1); else { S.end = true; render(); } }
function prev() { if (S.s > 0) go(S.l, S.s - 1); else if (S.l > 0) go(S.l - 1, LEVELS[S.l - 1].steps.length - 1); }
function render() {
  setT(document.getElementById('score'), scoreText());
  document.getElementById('rail').replaceChildren(...LEVELS.map((L, i) => h('button', { type: 'button', class: levelDone(i) ? 'done' : '', title: L.n, 'aria-label': `第 ${i + 1} 关：${L.n}`, 'aria-current': !S.end && i === S.l ? 'step' : null, onclick: () => go(i) }, i + 1)));
  const stage = document.getElementById('stage');
  if (S.end) { stage.replaceChildren(h('div', { class: 'big-done' }, h('h1', null, '20 关练习完成！ || Latihan 20 peringkat selesai!'), h('p', { class: 'ask' }, `你完成了 ${S.done.size} / ${total} 题。正式作答时，请仔细看 DCS 画面上的题目。 || Anda menyelesaikan ${S.done.size} / ${total} soalan. Semasa menjawab DCS sebenar, baca soalan pada skrin dengan teliti.`), h('button', { class: 'btn main', type: 'button', onclick: () => { S.done.clear(); go(0); } }, '重新开始 || Mula semula'))); return; }
  const L = LEVELS[S.l], st = L.steps[S.s], box = h('div', { class: 'box' }), fb = h('div', { class: 'fb', role: 'status' });
  const ctl = st.make(box), nx = h('button', { class: 'btn', type: 'button', onclick: next }, S.s + 1 < L.steps.length ? '下一题 || Soalan seterusnya' : S.l + 1 < LEVELS.length ? '下一关 || Peringkat seterusnya' : '完成 || Selesai');
  const show = r => { fb.className = 'fb ' + (r.ok ? 'ok' : 'no'); setT(fb, r.msg); if (r.ok) { S.done.add(key(S.l, S.s)); nx.classList.add('next'); setT(document.getElementById('score'), scoreText()); const b = document.querySelector('#rail [aria-current]'); if (levelDone(S.l)) b.classList.add('done'); } };
  stage.replaceChildren(
    h('div', { class: 'kick' }, h('span', { class: 'lv' }, `第 ${S.l + 1} 关 || Peringkat ${S.l + 1}`), L.steps.length > 1 && h('span', null, `第 ${S.s + 1} / ${L.steps.length} 题 || Soalan ${S.s + 1} / ${L.steps.length}`)),
    h('h1', null, L.n), h('p', { class: 'ask' }, st.ask), box, fb,
    h('div', { class: 'acts' }, h('button', { class: 'btn', type: 'button', disabled: S.l === 0 && S.s === 0, onclick: prev }, '上一题 || Sebelumnya'), h('button', { class: 'btn', type: 'button', onclick: render }, '重做 || Ulang'), h('button', { class: 'btn', type: 'button', onclick: () => { ctl.reveal(); fb.className = 'fb ok'; setT(fb, '老师示范：这是参考答案。 || Tunjuk cara guru: ini jawapan rujukan.'); } }, '显示答案 || Tunjuk jawapan'), h('span', { class: 'spacer' }), h('button', { class: 'btn main', type: 'button', onclick: () => show(ctl.check()) }, '提交 || Hantar'), nx));
}
setT(document.getElementById('brand'), 'DCS 闯关练习室 || Bilik Latihan DCS');
setT(document.getElementById('note'), '中文与马来文模拟练习。题型参考 DCS，题目是重新编写的，不记录成绩。 || Latihan simulasi dwibahasa. Jenis soalan merujuk DCS, soalan ditulis semula dan markah tidak direkodkan.');
const fromHash = () => { const m = /^#level-(\d+)$/.exec(location.hash); const n = m ? Number(m[1]) - 1 : 0; S.l = n >= 0 && n < LEVELS.length ? n : 0; S.s = 0; S.end = false; render(); };
addEventListener('hashchange', fromHash); fromHash();
</script>
